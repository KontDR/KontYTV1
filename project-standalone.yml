name: KontYT
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '16.0'
targets:
  KontYT:
    type: application
    platform: iOS
    sources:
    - App
    - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kontyt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: 0.13.39
        CURRENT_PROJECT_VERSION: '62'
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: KontYT
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
        INFOPLIST_KEY_UIFileSharingEnabled: true
        KONTYT_APP_GROUP: group.com.example.kontyt
        KONTYT_SHARE_MODE: standalone
    dependencies:
    - package: YouTubeKit
  KontYTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: KontYT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.0'
schemes:
  KontYT:
    build:
      targets:
        KontYT: all
    test:
      targets:
      - KontYTTests
      environmentVariables:
        KONTYT_SMOKE_VIDEO_ID: $(KONTYT_SMOKE_VIDEO_ID)
packages:
  YouTubeKit:
    path: Vendor/YouTubeKit
