name: KontYT Guncel
# The title is the only thing that tells you which file version ran: an old file keeps the old name,
# a re-run keeps the old one, and GitHub otherwise falls back to the commit message ("upload").
# Quoted, or the " #" of the run number would start a YAML comment and cut the title short.
# The revision marker below is checked by the first step: it answers "which file is this?" honestly.
# KONTYT-WORKFLOW-REV: R55a
run-name: "KontYT 0.13.40 build63 R55 R55a · #${{ github.run_number }} · ${{ github.event_name }} · ${{ github.ref_name }}"
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Paylaşım uzantılı veya sade kurulum'
        type: choice
        required: true
        default: with-share
        options: [with-share, standalone]
      smoke_video_id:
        description: 'İsteğe bağlı: kendi izinli videonun 11 karakterlik kimliği; boş bırakılabilir'
        type: string
        required: false
        default: ''
      confirm_rights:
        description: 'Canlı test videosunu işleme hakkım var'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write   # yalnızca IPA'yı yuvarlanan sürüme eklemek için (yedek kanal)
  actions: write    # artifact yükleme izni; bunu almadan yükleme 403 ile cevaplanır
jobs:
  build:
    runs-on: macos-15
    # Bir adım asılı kalırsa koşu saatlerce beklemesin: 45 dakika derleme için fazlasıyla yeterli.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Runs before the restore overwrites the file, so this is what GitHub actually read to start
      # the job. A mismatch means: the steps below are the OLD ones, the title above is the OLD one,
      # and only a brand new run (never "Re-run") will use the file the restore just wrote.
      - name: Is this the workflow file we think it is?
        run: |
          echo "--- depodaki is akisi dosyalari ---"
          ls -l .github/workflows/
          shasum -a 256 .github/workflows/kontyt-build.yml
          if grep -q 'KONTYT-WORKFLOW-REV: R55a' .github/workflows/kontyt-build.yml; then
            echo "OK: depodaki is akisi dosyasi bu surumle ayni (R55a)."
          else
            echo "::warning::Depodaki is akisi dosyasi bu surumden ESKI. Bu kosu eski adimlarla ve eski baslikla calisiyor. Geri yukleme dosyayi simdi yenileyecek: bu kosu bitince 'Run workflow' ile YENI bir kosu baslatin; 'Re-run' yapmayin."
          fi
      - name: Restore verified source snapshot
        run: python3 scripts/restore_kontyt.py
      # Named steps: when something fails, the red step name alone says what broke - no log needed.
      - name: 0/5 Ortam ve yuklenen dosyalar
        run: |
          sw_vers
          python3 --version
          echo "--- depo kokunde ne var ---"
          ls -la | head -40
          echo "--- iki dosya ---"
          ls -l .github/workflows/kontyt-build.yml scripts/restore_kontyt.py
          shasum -a 256 .github/workflows/kontyt-build.yml scripts/restore_kontyt.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 1/5 Python bagimliliklari
        run: python -m pip install -r requirements-dev.txt
      - name: 2/5 Birim testleri
        run: python -m unittest discover -s scripts/tests -v
      - name: 3/5 Surum paketi butunlugu
        run: python scripts/verify_release.py
      - name: 4/5 Kaynak ve varlik denetimi
        run: python scripts/check_source.py
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Select signing variant
        if: github.event.inputs.variant == 'standalone'
        run: cp project-standalone.yml project.yml
      - name: Generate project
        run: xcodegen generate
      - name: Resolve local packages
        run: xcodebuild -resolvePackageDependencies -project KontYT.xcodeproj -scheme KontYT
      - name: Run simulator unit tests
        env:
          REQUESTED_SMOKE_ID: ${{ github.event.inputs.smoke_video_id }}
          CONFIRM_RIGHTS: ${{ github.event.inputs.confirm_rights }}
        run: |
          SMOKE_ID=""
          if [ "$CONFIRM_RIGHTS" = "true" ] && [ -n "$REQUESTED_SMOKE_ID" ]; then
            [[ "$REQUESTED_SMOKE_ID" =~ ^[A-Za-z0-9_-]{11}$ ]] || { echo "Invalid video ID"; exit 1; }
            SMOKE_ID="$REQUESTED_SMOKE_ID"
          fi
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          set -o pipefail
          xcodebuild test -project KontYT.xcodeproj -scheme KontYT \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath TestData -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO KONTYT_SMOKE_VIDEO_ID="$SMOKE_ID" 2>&1 | tee simulator-test.log
      - name: Reject the removed WebKit Swift overlay
        if: always()
        run: |
          APP=TestData/Build/Products/Debug-iphonesimulator/KontYT.app/KontYT
          if [ ! -f "$APP" ]; then echo "No simulator app binary; nothing to check."; exit 0; fi
          if otool -L "$APP" | grep -q libswiftWebKit; then
            echo "::error::App links /usr/lib/swift/libswiftWebKit.dylib, which iOS 18.4+ does not ship. Use the plain Objective-C WebKit calls."
            exit 1
          fi
          echo "OK: no libswiftWebKit load command."
      - name: Build unsigned device application
        run: |
          set -o pipefail
          xcodebuild -project KontYT.xcodeproj -scheme KontYT -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee device-build.log
      - name: Seal App Group entitlements for sideload re-signing
        run: python scripts/sign_for_sideload.py DerivedData/Build/Products/Release-iphoneos/KontYT.app
      - name: Package for AltStore signing
        run: |
          mkdir -p Package/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/KontYT.app Package/Payload/
          # Küçük paket hem hızlı yüklenir hem de titrek serviste en az tökezleyen şeydir.
          find Package/Payload -name '*.dSYM' -prune -exec rm -rf {} + 2>/dev/null || true
          find Package/Payload -name '__MACOSX' -prune -exec rm -rf {} + 2>/dev/null || true
          cd Package
          zip -qr9y ../KontYT-sideload.ipa Payload
      - name: Report the package size
        run: |
          du -h KontYT-sideload.ipa
          shasum -a 256 KontYT-sideload.ipa | tee KontYT-sideload.ipa.sha256
      # Artifact servisi zaman zaman JSON yerine HTML hata sayfası döndürür; eylem de bunu
      # "geçersiz JSON" sayıp beş kez, artan beklemeyle yeniden dener ve dakikalar yakar.
      # Bu yüzden her deneme süreyle sınırlı ve öldürücü değil: arkada ikinci bir deneme,
      # onun da arkasında bambaşka bir uç nokta kullanan sürüm yüklemesi var. Titrek bir
      # servis artık "bu derleme IPA üretti mi?" sorusunun cevabını belirlemiyor.
      - name: Upload the sideload package
        id: ipa_once
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/upload-artifact@v4
        with:
          name: KontYT-AltStore
          path: |
            KontYT-sideload.ipa
            KontYT-sideload.ipa.sha256
          overwrite: true
          compression-level: 9
          retention-days: 30
      - name: Upload the sideload package (second try)
        id: ipa_twice
        if: steps.ipa_once.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/upload-artifact@v4
        with:
          name: KontYT-AltStore
          path: |
            KontYT-sideload.ipa
            KontYT-sideload.ipa.sha256
          overwrite: true
          compression-level: 9
          retention-days: 30
      - name: Attach the package to the rolling release
        id: ipa_release
        if: steps.ipa_once.outcome == 'failure' && steps.ipa_twice.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Artifact servisinden farklı bir uç nokta (uploads.github.com): ikisi nadiren
          # aynı anda düşer. Sürüm yuvarlanan bir sürümdür; en yeni derleme eskisini değiştirir.
          gh release view sideload-latest >/dev/null 2>&1 || \
            gh release create sideload-latest --target "$GITHUB_SHA" \
              --title "KontYT kurulum paketi" \
              --notes "Otomatik derleme çıkışı. AltStore ile yeniden imzalayıp kurun."
          gh release upload sideload-latest KontYT-sideload.ipa KontYT-sideload.ipa.sha256 --clobber
          echo "IPA_RELEASE=1" >> "$GITHUB_ENV"
      - name: Where to get the package
        id: ipa_where
        if: always()
        run: |
          echo "## KontYT 0.13.40 build63 R55" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.ipa_once.outcome }}" = "success" ] || [ "${{ steps.ipa_twice.outcome }}" = "success" ]; then
            echo "IPA: ${{ steps.ipa_once.outputs.artifact-url }}${{ steps.ipa_twice.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$IPA_RELEASE" ]; then
            echo "IPA: ${{ github.server_url }}/${{ github.repository }}/releases/tag/sideload-latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::IPA hiçbir kanala yüklenemedi (artifact servisi HTML hata sayfası döndürdü). Koşuyu yeniden çalıştırın; paket sürümde de yok."
            echo "IPA yüklenemedi." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Trim build diagnostics
        if: always()
        run: |
          # Tam bir xcodebuild günlüğü onlarca megabayt olur; teşhis için kuyruk yeterlidir.
          for f in simulator-test.log device-build.log; do
            [ -f "$f" ] || continue
            size=$(stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 4000000 ]; then tail -c 4000000 "$f" > "$f.part" && mv "$f.part" "$f"; fi
          done
      - name: Upload test results
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: KontYT-TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
      - name: Upload build diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: KontYT-BuildDiagnostics
          path: |
            simulator-test.log
            device-build.log
            RELEASE-MANIFEST.json
          if-no-files-found: ignore
